<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <!--
      在首屏绘制前确定主题，暗色用户不会先看到一闪白屏：切换过就用切换的（localStorage 'theme'），否则跟随系统。
      颜色变量在 src/index.css 里按 data-theme 定义，之后的切换由 src/context/ThemeContext.tsx 负责（theme-color 的取值也在那里）
    -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1e1e1e');
        }
      })();
    </script>
    <!-- 默认描述留给不执行 JS 的抓取方。每个页面都会用 SEOHelmet 渲染自己的，src/index.tsx 启动时先移除这两个，head 里不会出现两份 -->
    <meta
      name="description"
      content="C++游戏开发教程 - 从基础到高级，全面学习C++游戏开发技能，构建自己的游戏作品"
      data-default-seo="true"
    />
    <meta name="keywords" content="C++,游戏开发,编程教程,游戏编程,C++教程" data-default-seo="true" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>C++游戏开发 | 从入门到精通</title>

    <!--
      统计：GA4 + 百度统计，只在生产构建里加载（npm start 本地开发时不产生数据）。
      两边的自动 PV 都已关闭，页面浏览由 src/utils/analytics.ts 在页面标题确定后上报。
      GA4 后台还需要关闭「增强型衡量 → 网页浏览 → 基于浏览器历史记录事件的网页变化」，否则站内跳转会重复计数。
    -->
    <script>
      if ('%NODE_ENV%' === 'production') {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', 'G-JLHZH11YW4', { send_page_view: false });

        window._hmt = window._hmt || [];
        window._hmt.push(['_setAutoPageview', false]);

        [
          'https://www.googletagmanager.com/gtag/js?id=G-JLHZH11YW4',
          'https://hm.baidu.com/hm.js?ae1e702f9479de874856783623fcbaf9'
        ].forEach(function (src) {
          var script = document.createElement('script');
          script.async = true;
          script.src = src;
          document.head.appendChild(script);
        });
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.

    -->
  </body>
</html>

    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />

    <meta name="theme-color" content="#000000" />

      name="description"
      content="C++游戏开发教程 - 从基础到高级，全面学习C++游戏开发技能，构建自己的游戏作品"

    />

    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will

      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>C++游戏开发 | 从入门到精通</title>

    <!--
      统计：GA4 + 百度统计，只在生产构建里加载（npm start 本地开发时不产生数据）。
      两边的自动 PV 都已关闭，页面浏览由 src/utils/analytics.ts 在页面标题确定后上报。
      GA4 后台还需要关闭「增强型衡量 → 网页浏览 → 基于浏览器历史记录事件的网页变化」，否则站内跳转会重复计数。
    -->
    <script>
      if ('%NODE_ENV%' === 'production') {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', 'G-JLHZH11YW4', { send_page_view: false });

        window._hmt = window._hmt || [];
        window._hmt.push(['_setAutoPageview', false]);

        [
          'https://www.googletagmanager.com/gtag/js?id=G-JLHZH11YW4',
          'https://hm.baidu.com/hm.js?ae1e702f9479de874856783623fcbaf9'
        ].forEach(function (src) {
          var script = document.createElement('script');
          script.async = true;
          script.src = src;
          document.head.appendChild(script);
        });
      }
    </script>

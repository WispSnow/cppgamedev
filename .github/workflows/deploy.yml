name: Build and Deploy React App

# 触发条件：当有代码 push 到 deploy 分支时
on:
  push:
    branches:
      - deploy

  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy Job
    # 运行环境：使用最新的Ubuntu系统
    runs-on: ubuntu-latest

    steps:
      # 第1步：检出你的仓库代码
      - name: Checkout Code
        uses: actions/checkout@v7

      # 第2步：设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # 第3步：安装并构建 Frontend
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      # 第4步：安装 Backend 依赖（生产环境）
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci --production

      # 第5步：部署 Frontend 到服务器
      - name: Deploy Frontend to Server
        uses: easingthemes/ssh-deploy@v6.0.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # Frontend 构建后的静态文件
          SOURCE: "frontend/build/"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          # 部署到 Web 服务器目录（例如 /var/www/html）
          TARGET: ${{ secrets.FRONTEND_DIR }}
          # --delete：清掉上一次构建残留的旧 chunk，否则带哈希的文件会无限堆积。
          # 该目录完全由 CI 产出，不含任何服务器侧数据。
          ARGS: "-rlgoDzvc -i --delete"

      # 第6步：部署 Backend 到服务器
      - name: Deploy Backend to Server
        uses: easingthemes/ssh-deploy@v6.0.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # Backend 源代码和 node_modules
          SOURCE: "backend/"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          # 部署到后端应用目录
          TARGET: ${{ secrets.BACKEND_DIR }}
          # 排除不需要的文件
          EXCLUDE: "node_modules/, .git/, .env"
          # --delete：让仓库里删掉的文件同步从服务器消失。
          # rsync 默认不会删除被 EXCLUDE 保护的接收端文件（那需要 --delete-excluded，
          # 本 action 不支持该选项），所以 node_modules/ 与服务器上的 .env 是安全的。
          # 注意：今后若后端要在自己目录下写运行期数据（上传、缓存、数据库），
          # 必须先加进 EXCLUDE，否则会被每次部署清掉。
          ARGS: "-rlgoDzvc -i --delete"
      
      # 第7步：在服务器上重新安装 Backend 依赖并重启服务
      - name: Restart Backend Service
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.BACKEND_DIR }}
            npm ci --production
            # 使用 systemctl 重启服务
            sudo systemctl restart cppgamedev-backend.service